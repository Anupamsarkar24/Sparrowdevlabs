<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparrow Dev Labs - Premium Logo Reveal</title>
  <style>
    /* ============================================================
       SPARROW DEV LABS - LUXURY LOGO REVEAL (CLEAN & ELEGANT)
       Background: #050505
       Pure logo.png image reveal with clean energy orb & orbit ring
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050505;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .loader-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 600px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .canvas-wrapper {
      position: relative;
      width: 360px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand-text {
      position: absolute;
      bottom: 70px;
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: 13px;
      color: #ffffff;
      opacity: 0.4;
      letter-spacing: 0.4em;
      text-transform: lowercase;
      user-select: none;
      pointer-events: none;
    }

    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, rgba(14, 165, 233, 0.015) 45%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="loader-container">
    <div class="canvas-wrapper">
      <canvas id="loaderCanvas" width="720" height="720"></canvas>
    </div>
    <div class="brand-text">sparrow-dev-labs</div>
  </div>

  <script>
    /**
     * SPARROW DEV LABS - CINEMATIC CLEAN LOGO REVEAL (3.0s / 60 FPS)
     * Renders exact logo.png source image with clean clip mask reveal & orbit ring.
     * No overlapping messy strokes.
     */
    (function () {
      const canvas = document.getElementById('loaderCanvas');
      const ctx = canvas.getContext('2d');

      const W = canvas.width;  // 720
      const H = canvas.height; // 720
      const cx = W / 2;
      const cy = H / 2 - 10;

      // Load Official logo.png Source Image
      const logoImg = new Image();
      logoImg.src = 'assets/images/logo.png';
      let logoLoaded = false;
      logoImg.onload = () => { logoLoaded = true; };

      // Logo Render Dimensions
      const imgW = 260;
      const imgH = 260;
      const imgX = cx - imgW / 2;
      const imgY = cy - imgH / 2;

      // Outer Contour Motion Points for Particle Brush (Bottom-left -> Upward -> Head -> Base)
      const contourPoints = [
        { x: imgX + 25,  y: imgY + 250 }, // 0: Wing tip (bottom-left)
        { x: imgX + 80,  y: imgY + 180 }, // 1: Feather wing edge
        { x: imgX + 135, y: imgY + 120 }, // 2: Wing top
        { x: imgX + 175, y: imgY + 120 }, // 3: Neck mid
        { x: imgX + 200, y: imgY + 50  }, // 4: Head top
        { x: imgX + 240, y: imgY + 70  }, // 5: Beak tip
        { x: imgX + 205, y: imgY + 180 }, // 6: Chest curve
        { x: imgX + 245, y: imgY + 245 }, // 7: Base right
        { x: imgX + 25,  y: imgY + 250 }  // 8: Back to Wing tip
      ];

      function getContourPoint(t) {
        const total = contourPoints.length - 1;
        const scaledT = Math.max(0, Math.min(1, t)) * total;
        const i = Math.floor(scaledT);
        const localT = scaledT - i;
        const p1 = contourPoints[i];
        const p2 = contourPoints[Math.min(total, i + 1)];
        return {
          x: p1.x + (p2.x - p1.x) * localT,
          y: p1.y + (p2.y - p1.y) * localT
        };
      }

      // Background Ambient Dust
      const dust = [];
      for (let i = 0; i < 20; i++) {
        dust.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.2 + 0.4,
          alpha: Math.random() * 0.15 + 0.05,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2
        });
      }

      function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

      const DURATION = 3000; // 3.0s total loop
      let startTime = null;

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const seconds = elapsed / 1000.0; // 0.0s -> 3.0s

        // 1. Clear Frame with #050505
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, W, H);

        // 2. Render Ambient Particles
        ctx.fillStyle = '#ffffff';
        dust.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
          ctx.globalAlpha = p.alpha;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // ---------------------------------------------------------
        // 8-STAGE TIMELINE CALCULATIONS (0.0s -> 3.0s)
        // ---------------------------------------------------------
        let drawPct = 0;
        let fillOpacity = 0;
        let activeParticlePos = getContourPoint(0);
        let particleAlpha = 0;
        let ringAlpha = 0;
        let ringAngle = 0;
        let breathingGlow = 0;
        let sheenPos = -1;

        // Stage 01 — Birth (0.0s - 0.3s)
        if (seconds < 0.3) {
          const t = seconds / 0.3;
          particleAlpha = easeOutCubic(t);
          activeParticlePos = getContourPoint(0);
        }
        // Stage 02 & 03 — Drawing & Shape Formation (0.3s - 1.3s)
        else if (seconds < 1.3) {
          const t = (seconds - 0.3) / 1.0;
          const easedT = easeInOutCubic(t);
          drawPct = easedT;
          fillOpacity = Math.max(0, (t - 0.2) / 0.8);
          particleAlpha = 1.0;
          activeParticlePos = getContourPoint(drawPct);
        }
        // Stage 04 — Logo Completion & Metallic Sheen Pass (1.3s - 1.7s)
        else if (seconds < 1.7) {
          const t = (seconds - 1.3) / 0.4;
          drawPct = 1.0;
          fillOpacity = 1.0;
          particleAlpha = 1.0;
          sheenPos = t;
          const passAngle = (t * Math.PI * 0.4) - Math.PI / 4;
          activeParticlePos = { x: cx + Math.cos(passAngle) * 170, y: cy + Math.sin(passAngle) * 150 };
        }
        // Stage 05 — Orbit (1.7s - 2.1s)
        else if (seconds < 2.1) {
          const t = (seconds - 1.7) / 0.4;
          drawPct = 1.0; fillOpacity = 1.0; particleAlpha = 1.0;
          ringAlpha = Math.min(t * 1.6, 0.85);
          ringAngle = (Math.PI * 0.15) + (easeInOutCubic(t) * Math.PI * 1.65);
          activeParticlePos = { x: cx + Math.cos(ringAngle) * 175, y: cy + Math.sin(ringAngle) * 155 };
        }
        // Stage 06 — Energy Ring & Breathing Glow (2.1s - 2.5s)
        else if (seconds < 2.5) {
          const t = (seconds - 2.1) / 0.4;
          drawPct = 1.0; fillOpacity = 1.0; particleAlpha = 1.0;
          ringAlpha = 0.85 * (1.0 - t * 0.5);
          breathingGlow = Math.sin(t * Math.PI) * 0.35;
          ringAngle = (Math.PI * 1.8) + (t * Math.PI * 0.4);
          activeParticlePos = { x: cx + Math.cos(ringAngle) * 175, y: cy + Math.sin(ringAngle) * 155 };
        }
        // Stage 07 — Reverse Collection Dissolve (2.5s - 2.8s)
        else if (seconds < 2.8) {
          const t = (seconds - 2.5) / 0.3;
          const unDraw = 1.0 - easeInOutCubic(t);
          drawPct = unDraw;
          fillOpacity = unDraw;
          particleAlpha = Math.max(0.3, 1.0 - t * 0.4);
          ringAlpha = (1.0 - t) * 0.3;
          activeParticlePos = getContourPoint(unDraw);
        }
        // Stage 08 — Final Return to Birth Origin (2.8s - 3.0s)
        else {
          const t = (seconds - 2.8) / 0.2;
          particleAlpha = 1.0 - t;
          activeParticlePos = getContourPoint(0);
        }

        // ---------------------------------------------------------
        // RENDER 100% AUTHENTIC LOGO.PNG SOURCE IMAGE
        // ---------------------------------------------------------
        if (logoLoaded && fillOpacity > 0.01) {
          ctx.save();
          ctx.globalAlpha = fillOpacity;

          // Subtle Blue Outer Ambient Glow
          ctx.shadowColor = 'rgba(56, 189, 248, ' + (0.3 + breathingGlow * 0.3) + ')';
          ctx.shadowBlur = 20 + breathingGlow * 12;

          // Clip Mask Reveal following particle motion
          if (drawPct < 0.99) {
            const clipRadius = drawPct * (imgW * 1.4);
            ctx.beginPath();
            ctx.arc(contourPoints[0].x, contourPoints[0].y, clipRadius, 0, Math.PI * 2);
            ctx.clip();
          }

          // Draw Pure logo.png
          ctx.drawImage(logoImg, imgX, imgY, imgW, imgH);

          // Metallic Sheen Highlight Sweep (Stage 04)
          if (sheenPos > 0 && sheenPos < 1) {
            const sx = imgX - 100 + sheenPos * (imgW + 200);
            const sheenGrad = ctx.createLinearGradient(sx - 30, imgY, sx + 30, imgY + imgH);
            sheenGrad.addColorStop(0, 'rgba(255,255,255,0)');
            sheenGrad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
            sheenGrad.addColorStop(1, 'rgba(255,255,255,0)');

            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = sheenGrad;
            ctx.fillRect(imgX, imgY, imgW, imgH);
            ctx.globalCompositeOperation = 'source-over';
          }

          ctx.restore();
        }

        // ---------------------------------------------------------
        // RENDER ELEGANT CIRCULAR ORBIT RING (STAGE 05 & 06)
        // ---------------------------------------------------------
        if (ringAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = ringAlpha;
          ctx.beginPath();
          ctx.ellipse(cx, cy, 175, 155, -0.08, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(56, 189, 248, ' + (ringAlpha * 0.55) + ')';
          ctx.lineWidth = 1.6;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 14;
          ctx.stroke();
          ctx.restore();
        }

        // ---------------------------------------------------------
        // RENDER SINGLE CONTINUOUS ENERGY ORB PARTICLE
        // ---------------------------------------------------------
        if (particleAlpha > 0.01) {
          drawEnergyOrb(ctx, activeParticlePos.x, activeParticlePos.y, particleAlpha);
        }

        requestAnimationFrame(render);
      }

      // Helper: Draw Glowing Blue-White Energy Orb Particle
      function drawEnergyOrb(context, x, y, alpha) {
        context.save();
        context.globalAlpha = alpha;

        const glowGrad = context.createRadialGradient(x, y, 0, x, y, 26);
        glowGrad.addColorStop(0, '#38bdf8');
        glowGrad.addColorStop(0.4, 'rgba(56, 189, 248, 0.4)');
        glowGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
        context.fillStyle = glowGrad;
        context.beginPath(); context.arc(x, y, 26, 0, Math.PI * 2); context.fill();

        const coreGrad = context.createRadialGradient(x, y, 0, x, y, 6.5);
        coreGrad.addColorStop(0, '#FFFFFF');
        coreGrad.addColorStop(0.6, '#93c5fd');
        coreGrad.addColorStop(1, '#38bdf8');
        context.fillStyle = coreGrad;
        context.beginPath(); context.arc(x, y, 6.5, 0, Math.PI * 2); context.fill();

        context.restore();
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
