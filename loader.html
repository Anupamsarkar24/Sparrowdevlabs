<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparrow Dev Labs - Premium Logo Reveal Animation</title>
  <style>
    /* ============================================================
       SPARROW DEV LABS - LUXURY LOGO REVEAL (3.0s 60FPS SPECIFICATION)
       Background: #050505
       Font: Thin Modern Sans-Serif
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050505;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .loader-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 600px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .canvas-wrapper {
      position: relative;
      width: 360px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand-text {
      position: absolute;
      bottom: 75px;
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: 13px;
      color: #ffffff;
      opacity: 0.4;
      letter-spacing: 0.4em;
      text-transform: lowercase;
      user-select: none;
      pointer-events: none;
    }

    /* Ambient soft background radial glow */
    .bg-glow {
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.05) 0%, rgba(14, 165, 233, 0.02) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="loader-container">
    <div class="canvas-wrapper">
      <canvas id="loaderCanvas" width="720" height="720"></canvas>
    </div>
    <div class="brand-text">sparrow-dev-labs</div>
  </div>

  <script>
    /**
     * SPARROW DEV LABS - CINEMATIC LOGO REVEAL (3.0s / 60 FPS GPU ACCELERATED)
     * Continuous Single-Particle Flow Architecture
     * Seamless Infinite Loop (Frame 1 === Frame 100)
     */
    (function () {
      const canvas = document.getElementById('loaderCanvas');
      const ctx = canvas.getContext('2d');

      const width = canvas.width;   // 720
      const height = canvas.height;  // 720
      const cx = width / 2;
      const cy = height / 2 - 10;

      // Scale & Center Mapping for Logo
      const scale = 2.3;
      const ox = cx - 20;
      const oy = cy - 20;

      // SVG Path definitions for Bird Body & Feather Wing
      const bodySvgD = "M -40,110 L 50,110 C 65,110 75,95 65,75 L 25,-10 C 15,-30 25,-60 45,-75 C 65,-90 60,-115 35,-120 C 10,-125 -25,-105 -35,-80 C -45,-55 -30,-25 -10,0 L 20,45 C 30,60 20,75 5,80 L -35,80 Z";
      const wingSvgD = "M -110,95 C -60,40 -20,-10 10,-55 C 5,-20 -20,30 -50,65 C -70,85 -95,95 -110,95 Z";

      // Eye Circle: cx: 32, cy: -98, r: 7
      const eyeCircle = { x: ox + 32 * scale / 1.5, y: oy - 98 * scale / 1.5, r: 7 * scale / 1.5 };

      // SVG Measurers
      const bodyPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      bodyPath.setAttribute('d', bodySvgD);
      const bodyLen = bodyPath.getTotalLength();

      const wingPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      wingPath.setAttribute('d', wingSvgD);
      const wingLen = wingPath.getTotalLength();

      function getBodyPoint(len) {
        const pt = bodyPath.getPointAtLength(Math.min(Math.max(len, 0), bodyLen));
        return { x: ox + pt.x * (scale / 1.5), y: oy + pt.y * (scale / 1.5) };
      }

      function getWingPoint(len) {
        const pt = wingPath.getPointAtLength(Math.min(Math.max(len, 0), wingLen));
        return { x: ox + pt.x * (scale / 1.5), y: oy + pt.y * (scale / 1.5) };
      }

      // Pre-sample Path Coordinates
      const bodySamples = [];
      for (let l = 0; l <= bodyLen; l += 1.5) bodySamples.push(getBodyPoint(l));
      bodySamples.push(getBodyPoint(bodyLen));

      const wingSamples = [];
      for (let l = 0; l <= wingLen; l += 1.5) wingSamples.push(getWingPoint(l));
      wingSamples.push(getWingPoint(wingLen));

      // Ambient Dust Particles
      const particles = [];
      for (let i = 0; i < 18; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.2 + 0.4,
          alpha: Math.random() * 0.15 + 0.05,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2
        });
      }

      // Smooth Easing Functions
      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }
      function easeInCubic(t) {
        return t * t * t;
      }

      // Duration: 3.0 Seconds Total
      const DURATION = 3000;
      let startTime = null;

      // -------------------------------------------------------------
      // MAIN 60 FPS GPU-ACCELERATED RENDER LOOP
      // -------------------------------------------------------------
      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const seconds = elapsed / 1000.0; // 0.0s -> 3.0s

        // 1. Clear Frame with #050505
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, width, height);

        // 2. Render Ambient Particles
        ctx.fillStyle = '#ffffff';
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
          ctx.globalAlpha = p.alpha;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // ---------------------------------------------------------
        // STAGE TIMING & MOTION CALCULATIONS (0.0s -> 3.0s)
        // ---------------------------------------------------------
        let bodyDrawPct = 0;
        let wingDrawPct = 0;
        let fillOpacity = 0;
        let particlePos = { x: bodySamples[0].x, y: bodySamples[0].y };
        let particleAlpha = 0;
        let ringAlpha = 0;
        let ringOrbitAngle = 0;
        let breathingGlow = 0;
        let isReversing = false;

        // STAGE 01 — Birth (0.0s - 0.3s)
        if (seconds < 0.3) {
          const t = seconds / 0.3;
          particleAlpha = easeOutCubic(t);
          // Particle starts accelerating near bottom-left
          const pIdx = Math.floor(easeInCubic(t) * (bodySamples.length * 0.08));
          particlePos = bodySamples[Math.min(pIdx, bodySamples.length - 1)];
        }
        // STAGE 02 & STAGE 03 — Drawing Begins & Shape Formation (0.3s - 1.2s)
        else if (seconds < 1.2) {
          const t = (seconds - 0.3) / 0.9; // 0 -> 1
          const easedT = easeInOutCubic(t);
          bodyDrawPct = Math.min(easedT * 1.08, 1.0);
          wingDrawPct = Math.max(0, (easedT - 0.2) / 0.8);
          fillOpacity = Math.max(0, (t - 0.45) / 0.45);
          particleAlpha = 1.0;

          const pIdx = Math.floor(bodyDrawPct * (bodySamples.length - 1));
          particlePos = bodySamples[Math.min(pIdx, bodySamples.length - 1)];
        }
        // STAGE 04 — Logo Completion & Comet Pass (1.2s - 1.7s)
        else if (seconds < 1.7) {
          const t = (seconds - 1.2) / 0.5;
          bodyDrawPct = 1.0;
          wingDrawPct = 1.0;
          fillOpacity = 1.0;
          particleAlpha = 1.0;

          // Comet motion continuing smoothly past logo top into orbit entry
          const passAngle = (t * Math.PI * 0.4) - Math.PI / 4;
          const rx = 160, ry = 140;
          particlePos = {
            x: cx + Math.cos(passAngle) * rx,
            y: cy + Math.sin(passAngle) * ry
          };
        }
        // STAGE 05 — Orbit (1.7s - 2.1s)
        else if (seconds < 2.1) {
          const t = (seconds - 1.7) / 0.4;
          bodyDrawPct = 1.0;
          wingDrawPct = 1.0;
          fillOpacity = 1.0;
          particleAlpha = 1.0;
          ringAlpha = Math.min(t * 1.5, 0.8);

          ringOrbitAngle = (Math.PI * 0.15) + (easeInOutCubic(t) * Math.PI * 1.6);
          const rx = 165, ry = 145;
          particlePos = {
            x: cx + Math.cos(ringOrbitAngle) * rx,
            y: cy + Math.sin(ringOrbitAngle) * ry
          };
        }
        // STAGE 06 — Energy Ring & Breathing Glow (2.1s - 2.5s)
        else if (seconds < 2.5) {
          const t = (seconds - 2.1) / 0.4;
          bodyDrawPct = 1.0;
          wingDrawPct = 1.0;
          fillOpacity = 1.0;
          particleAlpha = 1.0;
          ringAlpha = 0.8 * (1.0 - t * 0.5);

          // Soft breathing glow pulse
          breathingGlow = Math.sin(t * Math.PI) * 0.35;

          // Orbit continuation heading towards reverse entry point
          ringOrbitAngle = (Math.PI * 1.75) + (t * Math.PI * 0.5);
          const rx = 165, ry = 145;
          particlePos = {
            x: cx + Math.cos(ringOrbitAngle) * rx,
            y: cy + Math.sin(ringOrbitAngle) * ry
          };
        }
        // STAGE 07 — Dissolve / Reverse Collection (2.5s - 2.8s)
        else if (seconds < 2.8) {
          const t = (seconds - 2.5) / 0.3; // 0 -> 1
          const unDraw = 1.0 - easeInOutCubic(t);
          bodyDrawPct = unDraw;
          wingDrawPct = unDraw;
          fillOpacity = unDraw;
          particleAlpha = Math.max(0.4, 1.0 - t * 0.4);
          ringAlpha = (1.0 - t) * 0.3;
          isReversing = true;

          // Particle travels back along the path, "collecting" the logo stroke
          const pIdx = Math.floor(unDraw * (bodySamples.length - 1));
          particlePos = bodySamples[Math.max(0, Math.min(pIdx, bodySamples.length - 1))];
        }
        // STAGE 08 — Seamless Loop Return (2.8s - 3.0s)
        else {
          const t = (seconds - 2.8) / 0.2; // 0 -> 1
          particleAlpha = 1.0 - t; // Smoothly fades to initial birth state
          // Particle settles back to initial birth position at bodySamples[0]
          particlePos = bodySamples[0];
        }

        // ---------------------------------------------------------
        // RENDER LOGO BODY & WING FILL (WITH METALLIC SHEEN)
        // ---------------------------------------------------------
        if (fillOpacity > 0.01) {
          ctx.save();
          ctx.globalAlpha = fillOpacity;

          // Body Platinum Fill
          ctx.beginPath();
          for (let i = 0; i < bodySamples.length; i++) {
            if (i === 0) ctx.moveTo(bodySamples[i].x, bodySamples[i].y);
            else ctx.lineTo(bodySamples[i].x, bodySamples[i].y);
          }
          ctx.closePath();

          const bodyGrad = ctx.createLinearGradient(cx - 100, cy - 100, cx + 100, cy + 100);
          bodyGrad.addColorStop(0, '#ffffff');
          bodyGrad.addColorStop(0.65, '#e2e8f0');
          bodyGrad.addColorStop(1, '#cbd5e1');
          ctx.fillStyle = bodyGrad;
          ctx.shadowColor = 'rgba(255, 255, 255, ' + (0.15 + breathingGlow) + ')';
          ctx.shadowBlur = 22;
          ctx.fill();

          // Eye Circle
          ctx.beginPath();
          ctx.arc(eyeCircle.x, eyeCircle.y, eyeCircle.r, 0, Math.PI * 2);
          ctx.fillStyle = '#050505';
          ctx.fill();

          // Wing Cyan Gradient Fill
          ctx.beginPath();
          for (let i = 0; i < wingSamples.length; i++) {
            if (i === 0) ctx.moveTo(wingSamples[i].x, wingSamples[i].y);
            else ctx.lineTo(wingSamples[i].x, wingSamples[i].y);
          }
          ctx.closePath();

          const wingGrad = ctx.createLinearGradient(cx - 120, cy + 80, cx - 20, cy - 40);
          wingGrad.addColorStop(0, '#0284c7');
          wingGrad.addColorStop(0.5, '#38bdf8');
          wingGrad.addColorStop(1, '#93c5fd');
          ctx.fillStyle = wingGrad;
          ctx.shadowColor = 'rgba(56, 189, 248, ' + (0.3 + breathingGlow) + ')';
          ctx.shadowBlur = 28;
          ctx.fill();

          ctx.restore();
        }

        // ---------------------------------------------------------
        // RENDER LOGO DRAWING & REVERSE COLLECTION STROKES
        // ---------------------------------------------------------
        ctx.save();

        if (bodyDrawPct > 0.01) {
          const drawCount = Math.floor(bodySamples.length * bodyDrawPct);
          if (drawCount > 1) {
            ctx.beginPath();
            for (let i = 0; i < drawCount; i++) {
              if (i === 0) ctx.moveTo(bodySamples[i].x, bodySamples[i].y);
              else ctx.lineTo(bodySamples[i].x, bodySamples[i].y);
            }
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = isReversing ? 2.0 : 3.0;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';
            ctx.shadowBlur = 14;
            ctx.stroke();
          }
        }

        if (wingDrawPct > 0.01) {
          const drawCount = Math.floor(wingSamples.length * wingDrawPct);
          if (drawCount > 1) {
            ctx.beginPath();
            for (let i = 0; i < drawCount; i++) {
              if (i === 0) ctx.moveTo(wingSamples[i].x, wingSamples[i].y);
              else ctx.lineTo(wingSamples[i].x, wingSamples[i].y);
            }
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = isReversing ? 1.8 : 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(56, 189, 248, 1.0)';
            ctx.shadowBlur = 16;
            ctx.stroke();
          }
        }

        // ---------------------------------------------------------
        // RENDER GLOWING ORBIT RING (STAGE 05 & 06)
        // ---------------------------------------------------------
        if (ringAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = ringAlpha;
          ctx.beginPath();
          ctx.ellipse(cx, cy, 165, 145, -0.1, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(56, 189, 248, ' + (ringAlpha * 0.5) + ')';
          ctx.lineWidth = 1.5;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 16;
          ctx.stroke();
          ctx.restore();
        }

        // ---------------------------------------------------------
        // RENDER SINGLE CONTINUOUS ENERGY PARTICLE (NEVER TELEPORTS)
        // ---------------------------------------------------------
        if (particleAlpha > 0.01) {
          drawEnergyParticle(ctx, particlePos.x, particlePos.y, particleAlpha);
        }

        ctx.restore();

        // Continuous 60 FPS Render Loop
        requestAnimationFrame(render);
      }

      // Helper: Draw Glowing Blue-White Energy Particle Brush
      function drawEnergyParticle(context, x, y, alpha) {
        context.save();
        context.globalAlpha = alpha;

        // Outer Flare
        const outerGrad = context.createRadialGradient(x, y, 0, x, y, 26);
        outerGrad.addColorStop(0, 'rgba(56, 189, 248, 0.9)');
        outerGrad.addColorStop(0.35, 'rgba(56, 189, 248, 0.4)');
        outerGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
        context.fillStyle = outerGrad;
        context.beginPath();
        context.arc(x, y, 26, 0, Math.PI * 2);
        context.fill();

        // Intense White Spark Core
        const coreGrad = context.createRadialGradient(x, y, 0, x, y, 7);
        coreGrad.addColorStop(0, '#ffffff');
        coreGrad.addColorStop(0.6, '#93c5fd');
        coreGrad.addColorStop(1, '#38bdf8');
        context.fillStyle = coreGrad;
        context.beginPath();
        context.arc(x, y, 7, 0, Math.PI * 2);
        context.fill();

        context.restore();
      }

      // Start 60 FPS Loop
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
