<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparrow Dev Labs - Exact Architectural Logo Reveal</title>
  <style>
    /* ============================================================
       SPARROW DEV LABS - EXACT LOGO CONSTRUCTION REVEAL
       Background: #050505
       Artboard: 1000 x 1000 (340x520 Logo Proportions)
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050505;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .loader-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 600px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .canvas-wrapper {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand-text {
      position: absolute;
      bottom: 60px;
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: 13px;
      color: #ffffff;
      opacity: 0.4;
      letter-spacing: 0.4em;
      text-transform: lowercase;
      user-select: none;
      pointer-events: none;
    }

    .bg-glow {
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(76, 174, 255, 0.08) 0%, rgba(43, 142, 255, 0.02) 50%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="loader-container">
    <div class="canvas-wrapper">
      <canvas id="loaderCanvas" width="1000" height="1000"></canvas>
    </div>
    <div class="brand-text">sparrow-dev-labs</div>
  </div>

  <script>
    /**
     * SPARROW DEV LABS - MATHEMATICAL LOGO REVEAL (1000x1000 ARTBOARD)
     * Exact Order of Motion Anchors:
     * 1. Bottom-left glowing point (wing tip X=210, Y=640).
     * 2. Draw the blue wing upward to X=430, Y=340.
     * 3. Continue into lower body.
     * 4. Draw neck upward in one continuous stroke.
     * 5. Form head circle (Diameter 72px at X=515, Y=180).
     * 6. Create beak (Length 28px, 18° upward).
     * 7. Add leg (Height 150px, 10°).
     * 8. Finish foot (Length 118px, 34px thick).
     * 9. Apply metallic highlights.
     * 10. Orbit with a single light trail.
     * 11. Reverse drawing order for infinite seamless loop.
     */
    (function () {
      const canvas = document.getElementById('loaderCanvas');
      const ctx = canvas.getContext('2d');

      const W = canvas.width;  // 1000
      const H = canvas.height; // 1000

      // Exact Vector Paths from Construction Guide (1000x1000 Viewbox)
      // Part 3 — Wing: Tip at (210, 640), Top at (430, 340)
      const wingOutlineSvg = "M 210,640 C 250,540 330,420 430,340 C 400,430 350,520 330,590 C 300,610 250,630 210,640 Z";
      const wingFeatherSvg = "M 408,362 C 360,430 310,500 270,550";

      // Part 1, 2, 4, 5 — Main Body (Neck, Head, Beak, Leg, Foot)
      const bodyOutlineSvg = "M 330,590 C 390,570 435,510 445,450 C 455,390 485,340 495,290 C 490,230 465,190 490,144 C 520,90 580,110 587,160 L 615,151 L 580,188 C 565,240 545,300 525,380 L 510,530 L 618,530 L 584,564 L 460,564 L 450,470 Z";

      // Eye Circle: Diameter 6px (Radius 3px) at X=535, Y=152
      const eyeCenter = { x: 535, y: 152, r: 3.5 };

      // Create SVG Path Objects for Point & Length Calculations
      const wingPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      wingPath.setAttribute('d', wingOutlineSvg);
      const wingLen = wingPath.getTotalLength();

      const featherPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      featherPath.setAttribute('d', wingFeatherSvg);
      const featherLen = featherPath.getTotalLength();

      const bodyPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      bodyPath.setAttribute('d', bodyOutlineSvg);
      const bodyLen = bodyPath.getTotalLength();

      // Sample Points along Paths for GPU-Accelerated 60 FPS Drawing
      const wingSamples = [];
      for (let l = 0; l <= wingLen; l += 2) {
        const pt = wingPath.getPointAtLength(l);
        wingSamples.push({ x: pt.x, y: pt.y });
      }

      const featherSamples = [];
      for (let l = 0; l <= featherLen; l += 2) {
        const pt = featherPath.getPointAtLength(l);
        featherSamples.push({ x: pt.x, y: pt.y });
      }

      const bodySamples = [];
      for (let l = 0; l <= bodyLen; l += 2) {
        const pt = bodyPath.getPointAtLength(l);
        bodySamples.push({ x: pt.x, y: pt.y });
      }

      // Single Continuous Path Sequence for Motion Anchor Particle:
      // Wing Tip (0) -> Wing Upward -> Lower Body -> Body & Head -> Complete
      const fullPathSequence = [...wingSamples, ...bodySamples];

      // Subtle Ambient Background Dust
      const dust = [];
      for (let i = 0; i < 24; i++) {
        dust.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.15 + 0.05,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2
        });
      }

      function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

      const DURATION = 3000; // 3.0 Seconds Loop
      let startTime = null;

      function render(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = (timestamp - startTime) % DURATION;
        const seconds = elapsed / 1000.0; // 0.0s -> 3.0s

        // 1. Fill Background #050505
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, W, H);

        // 2. Render Ambient Particles
        ctx.fillStyle = '#ffffff';
        dust.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
          ctx.globalAlpha = p.alpha;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // ---------------------------------------------------------
        // TIMELINE MOTION STATE CALCULATIONS
        // ---------------------------------------------------------
        let wingDrawPct = 0;
        let bodyDrawPct = 0;
        let featherDrawPct = 0;
        let fillOpacity = 0;
        let activeParticlePos = wingSamples[0];
        let particleAlpha = 0;
        let ringAlpha = 0;
        let ringAngle = 0;
        let breathingGlow = 0;
        let isReversing = false;

        // 1. Birth at Wing Tip (0.0s - 0.3s)
        if (seconds < 0.3) {
          const t = seconds / 0.3;
          particleAlpha = easeOutCubic(t);
          activeParticlePos = wingSamples[0];
        }
        // 2. Blue Wing Drawn Upward (0.3s - 0.7s)
        else if (seconds < 0.7) {
          const t = (seconds - 0.3) / 0.4;
          const easedT = easeInOutCubic(t);
          wingDrawPct = easedT;
          featherDrawPct = Math.max(0, (t - 0.2) / 0.8);
          particleAlpha = 1.0;
          const idx = Math.floor(wingDrawPct * (wingSamples.length - 1));
          activeParticlePos = wingSamples[idx];
        }
        // 3. Lower Body, Neck Upward, Head & Beak, Leg & Foot (0.7s - 1.4s)
        else if (seconds < 1.4) {
          const t = (seconds - 0.7) / 0.7;
          const easedT = easeInOutCubic(t);
          wingDrawPct = 1.0;
          featherDrawPct = 1.0;
          bodyDrawPct = easedT;
          fillOpacity = Math.max(0, (t - 0.4) / 0.6);
          particleAlpha = 1.0;
          const idx = Math.floor(bodyDrawPct * (bodySamples.length - 1));
          activeParticlePos = bodySamples[idx];
        }
        // 4. Logo Completed & Metallic Sheen Pass (1.4s - 1.8s)
        else if (seconds < 1.8) {
          const t = (seconds - 1.4) / 0.4;
          wingDrawPct = 1.0; featherDrawPct = 1.0; bodyDrawPct = 1.0; fillOpacity = 1.0;
          particleAlpha = 1.0;
          const passAngle = (t * Math.PI * 0.4) - Math.PI / 4;
          activeParticlePos = { x: 500 + Math.cos(passAngle) * 220, y: 360 + Math.sin(passAngle) * 200 };
        }
        // 5. Orbit with Single Light Trail (1.8s - 2.2s)
        else if (seconds < 2.2) {
          const t = (seconds - 1.8) / 0.4;
          wingDrawPct = 1.0; featherDrawPct = 1.0; bodyDrawPct = 1.0; fillOpacity = 1.0;
          particleAlpha = 1.0;
          ringAlpha = Math.min(t * 1.6, 0.85);
          ringAngle = (Math.PI * 0.15) + (easeInOutCubic(t) * Math.PI * 1.65);
          activeParticlePos = { x: 500 + Math.cos(ringAngle) * 230, y: 360 + Math.sin(ringAngle) * 210 };
        }
        // 6. Energy Ring & Subtle Breathing Glow (2.2s - 2.5s)
        else if (seconds < 2.5) {
          const t = (seconds - 2.2) / 0.3;
          wingDrawPct = 1.0; featherDrawPct = 1.0; bodyDrawPct = 1.0; fillOpacity = 1.0;
          particleAlpha = 1.0;
          ringAlpha = 0.85 * (1.0 - t * 0.5);
          breathingGlow = Math.sin(t * Math.PI) * 0.35;
          ringAngle = (Math.PI * 1.8) + (t * Math.PI * 0.4);
          activeParticlePos = { x: 500 + Math.cos(ringAngle) * 230, y: 360 + Math.sin(ringAngle) * 210 };
        }
        // 7. Reverse Drawing Order to Loop Seamlessly (2.5s - 2.8s)
        else if (seconds < 2.8) {
          const t = (seconds - 2.5) / 0.3;
          const unDraw = 1.0 - easeInOutCubic(t);
          wingDrawPct = unDraw;
          featherDrawPct = unDraw;
          bodyDrawPct = unDraw;
          fillOpacity = unDraw;
          particleAlpha = Math.max(0.4, 1.0 - t * 0.4);
          ringAlpha = (1.0 - t) * 0.3;
          isReversing = true;
          const idx = Math.floor(unDraw * (wingSamples.length - 1));
          activeParticlePos = wingSamples[Math.max(0, idx)];
        }
        // 8. Final Return to Wing Tip Origin (2.8s - 3.0s)
        else {
          const t = (seconds - 2.8) / 0.2;
          particleAlpha = 1.0 - t;
          activeParticlePos = wingSamples[0];
        }

        // ---------------------------------------------------------
        // RENDER EXACT LOGO GRADIENTS & FILLS
        // Main Body: #F6F6F6 with #FFFFFF top highlight & #A7A7A7 shadow
        // Wing Gradient: #DFF3FF (top) -> #77C8FF (middle) -> #2B8EFF (bottom)
        // ---------------------------------------------------------
        if (fillOpacity > 0.01) {
          ctx.save();
          ctx.globalAlpha = fillOpacity;

          // 1. Main Body Fill (#F6F6F6 to #A7A7A7)
          ctx.beginPath();
          for (let i = 0; i < bodySamples.length; i++) {
            if (i === 0) ctx.moveTo(bodySamples[i].x, bodySamples[i].y);
            else ctx.lineTo(bodySamples[i].x, bodySamples[i].y);
          }
          ctx.closePath();

          const bodyGrad = ctx.createLinearGradient(500, 100, 500, 600);
          bodyGrad.addColorStop(0, '#FFFFFF');
          bodyGrad.addColorStop(0.3, '#F6F6F6');
          bodyGrad.addColorStop(1, '#A7A7A7');
          ctx.fillStyle = bodyGrad;
          ctx.shadowColor = 'rgba(76, 174, 255, ' + (0.18 + breathingGlow) + ')';
          ctx.shadowBlur = 18;
          ctx.fill();

          // Eye Circle
          ctx.beginPath();
          ctx.arc(eyeCenter.x, eyeCenter.y, eyeCenter.r, 0, Math.PI * 2);
          ctx.fillStyle = '#050505';
          ctx.fill();

          // 2. Blue Wing Fill (#DFF3FF -> #77C8FF -> #2B8EFF)
          ctx.beginPath();
          for (let i = 0; i < wingSamples.length; i++) {
            if (i === 0) ctx.moveTo(wingSamples[i].x, wingSamples[i].y);
            else ctx.lineTo(wingSamples[i].x, wingSamples[i].y);
          }
          ctx.closePath();

          const wingGrad = ctx.createLinearGradient(430, 340, 210, 640);
          wingGrad.addColorStop(0, '#DFF3FF');
          wingGrad.addColorStop(0.5, '#77C8FF');
          wingGrad.addColorStop(1, '#2B8EFF');
          ctx.fillStyle = wingGrad;
          ctx.shadowColor = 'rgba(76, 174, 255, ' + (0.25 + breathingGlow) + ')';
          ctx.shadowBlur = 24;
          ctx.fill();

          // Feather Cut Outline
          if (featherDrawPct > 0.01) {
            const fCount = Math.floor(featherSamples.length * featherDrawPct);
            if (fCount > 1) {
              ctx.beginPath();
              for (let i = 0; i < fCount; i++) {
                if (i === 0) ctx.moveTo(featherSamples[i].x, featherSamples[i].y);
                else ctx.lineTo(featherSamples[i].x, featherSamples[i].y);
              }
              ctx.strokeStyle = '#050505';
              ctx.lineWidth = 14;
              ctx.lineCap = 'round';
              ctx.stroke();
            }
          }

          ctx.restore();
        }

        // ---------------------------------------------------------
        // RENDER STROKE REVEALS & REVERSE COLLECTION
        // ---------------------------------------------------------
        ctx.save();

        if (wingDrawPct > 0.01) {
          const wCount = Math.floor(wingSamples.length * wingDrawPct);
          if (wCount > 1) {
            ctx.beginPath();
            for (let i = 0; i < wCount; i++) {
              if (i === 0) ctx.moveTo(wingSamples[i].x, wingSamples[i].y);
              else ctx.lineTo(wingSamples[i].x, wingSamples[i].y);
            }
            ctx.strokeStyle = '#77C8FF';
            ctx.lineWidth = isReversing ? 2.5 : 4.0;
            ctx.lineCap = 'round';
            ctx.shadowColor = '#4CAEFF';
            ctx.shadowBlur = 18;
            ctx.stroke();
          }
        }

        if (bodyDrawPct > 0.01) {
          const bCount = Math.floor(bodySamples.length * bodyDrawPct);
          if (bCount > 1) {
            ctx.beginPath();
            for (let i = 0; i < bCount; i++) {
              if (i === 0) ctx.moveTo(bodySamples[i].x, bodySamples[i].y);
              else ctx.lineTo(bodySamples[i].x, bodySamples[i].y);
            }
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = isReversing ? 2.5 : 4.0;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'rgba(76, 174, 255, 0.8)';
            ctx.shadowBlur = 18;
            ctx.stroke();
          }
        }

        // ---------------------------------------------------------
        // RENDER SINGLE LIGHT TRAIL ORBIT (PART 10)
        // ---------------------------------------------------------
        if (ringAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = ringAlpha;
          ctx.beginPath();
          ctx.ellipse(500, 360, 230, 210, -0.08, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(76, 174, 255, ' + (ringAlpha * 0.6) + ')';
          ctx.lineWidth = 2.0;
          ctx.shadowColor = '#4CAEFF';
          ctx.shadowBlur = 18;
          ctx.stroke();
          ctx.restore();
        }

        // ---------------------------------------------------------
        // RENDER MOTION ANCHOR ENERGY PARTICLE
        // ---------------------------------------------------------
        if (particleAlpha > 0.01) {
          drawEnergyParticle(ctx, activeParticlePos.x, activeParticlePos.y, particleAlpha);
        }

        ctx.restore();

        // 60 FPS Continuous Loop
        requestAnimationFrame(render);
      }

      // Helper: Motion Anchor Particle Brush
      function drawEnergyParticle(context, x, y, alpha) {
        context.save();
        context.globalAlpha = alpha;

        const glowGrad = context.createRadialGradient(x, y, 0, x, y, 32);
        glowGrad.addColorStop(0, '#4CAEFF');
        glowGrad.addColorStop(0.4, 'rgba(76, 174, 255, 0.4)');
        glowGrad.addColorStop(1, 'rgba(76, 174, 255, 0)');
        context.fillStyle = glowGrad;
        context.beginPath(); context.arc(x, y, 32, 0, Math.PI * 2); context.fill();

        const coreGrad = context.createRadialGradient(x, y, 0, x, y, 8);
        coreGrad.addColorStop(0, '#FFFFFF');
        coreGrad.addColorStop(0.6, '#DFF3FF');
        coreGrad.addColorStop(1, '#4CAEFF');
        context.fillStyle = coreGrad;
        context.beginPath(); context.arc(x, y, 8, 0, Math.PI * 2); context.fill();

        context.restore();
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
